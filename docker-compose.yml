# =====================================================
# HEMIS Backend - Docker Compose
# =====================================================
# Backend + PostgreSQL + Redis
# Alohida ishga tushadi (frontend bilan bog'liq emas)
# =====================================================

version: '3.8'

services:
  # =====================================================
  # PostgreSQL Database
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: hemis-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # Audit Database (Alohida PostgreSQL)
  # =====================================================
  hemis-audit-db:
    image: postgres:16-alpine
    container_name: hemis-audit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME:-hemis_audit}
      POSTGRES_USER: ${AUDIT_DB_USER:-hemis_audit}
      # AUDIT_DB_PASSWORD .env'da o'rnatilishi shart (lokal dev uchun .env.example'da namuna).
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${AUDIT_DB_PORT:-5434}:5432"
    volumes:
      - audit-pg-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER:-hemis_audit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # Redis Cache
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: hemis-backend-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # =====================================================
  # Kafka (KRaft mode — no Zookeeper, single broker for dev)
  # =====================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: hemis-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listener: PLAINTEXT (docker-internal: kafka-ui/apicurio/backend-in-docker)
      # + PLAINTEXT_HOST (host'da bootRun'da ishlaydigan backend → localhost:29092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # =====================================================
  # Apicurio Schema Registry (in-memory — dev only)
  # =====================================================
  apicurio:
    image: apicurio/apicurio-registry-mem:2.5.0.Final
    container_name: hemis-apicurio
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: prod
    ports:
      - "${APICURIO_PORT:-8888}:8080"
    networks:
      - backend-network
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # =====================================================
  # Kafka-UI (browser admin UI — dev only)
  # =====================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hemis-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: hemis-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://apicurio:8080/apis/registry/v2
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8889}:8080"
    networks:
      - backend-network
    depends_on:
      kafka:
        condition: service_healthy

  # =====================================================
  # Backend (Spring Boot)
  # =====================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hemis-backend:${VERSION:-latest}
    container_name: hemis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      HEMIS_SECURITY_JWT_SECRET: ${JWT_SECRET}
      HEMIS_SECURITY_JWT_EXPIRATION: ${JWT_EXPIRATION:-43200}  # 12 hours in seconds (OLD-HEMIS: 43199)
      HEMIS_SECURITY_JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}  # 7 days in seconds
      HEMIS_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      SPRING_FLYWAY_CLEAN_DISABLED: ${FLYWAY_CLEAN_DISABLED:-true}
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_UZ_HEMIS: ${LOG_LEVEL_HEMIS:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2048m}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - backend-logs:/app/logs
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

# =====================================================
# Networks
# =====================================================
networks:
  backend-network:
    driver: bridge
    name: hemis-backend-network

# =====================================================
# Volumes
# =====================================================
volumes:
  postgres-data:
    name: hemis-backend-postgres-data
  audit-pg-data:
    name: hemis-audit-postgres-data
  redis-data:
    name: hemis-backend-redis-data
  kafka-data:
    name: hemis-kafka-data
  backend-logs:
    name: hemis-backend-logs
