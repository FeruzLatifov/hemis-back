replicaCount: 2

image:
  repository: harbor.e-edu.uz/central_hemis-back/hemis-back
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: central-hemis-pull-back

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: new-ministry.hemis.uz
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  paths:
    - path: /api/
      pathType: Prefix
    - path: /app/
      pathType: Prefix
    - path: /swagger-ui/
      pathType: Prefix
    - path: /v3/api-docs/
      pathType: Prefix

# Enterprise: Spring Boot + Hibernate + HikariCP pools + Redis + external integrations
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 6Gi

# HPA: 2-6 pods, nagruzka bo'yicha avtomatik scale
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  minAvailable: 1

springProfiles: "prod,redis,replica"
existingSecret: new-ministry-back-env

# JVM: Xmx = 4g (66% of 6Gi limit), qolgani metaspace/threads/NIO uchun
javaOpts: "-Xms2g -Xmx4g -XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

revisionHistoryLimit: 3

audit:
  enabled: true

migration:
  enabled: true
  activeDeadlineSeconds: 600

probes:
  startup:
    path: /actuator/health
    port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 24
  liveness:
    # Liveness — minimal check (livenessState faqat).
    # DB/Redis down bo'lsa pod restart loop'ga tushmaydi (cascade oldini olish).
    # Group sozlamasi: application.yml management.endpoint.health.group.liveness.include=livenessState
    path: /actuator/health/liveness
    port: 8080
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    # Readiness — DB + Redis ulangan, traffic qabul qila oladi.
    # DB tushganda traffic kelmasligi uchun group: readinessState,db,redis
    path: /actuator/health/readiness
    port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Apply the audit-DB schema from the pre-upgrade migration Job instead of from every app pod.
# Keep this true: it is what makes audit DDL behave like the main database's Liquibase — one
# writer, before any pod, no rolling-deploy race. Set it to false only to deploy against an audit
# database the Job cannot reach; the pods still self-heal, they just do it under contention.
auditSchemaInMigrationJob: true
