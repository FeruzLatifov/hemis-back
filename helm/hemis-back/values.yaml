replicaCount: 2

image:
  repository: harbor.e-edu.uz/ministry-back/hemis-back
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: new-ministry-pull-back

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: new-ministry.hemis.uz
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  paths:
    - path: /api/
      pathType: Prefix
    - path: /app/
      pathType: Prefix

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  minAvailable: 1

springProfiles: "prod,redis,replica"
existingSecret: new-ministry-back-env

javaOpts: "-Xms512m -Xmx1536m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

revisionHistoryLimit: 3

audit:
  enabled: false  # Set to true after creating test_ministry_audit database

migration:
  enabled: true
  activeDeadlineSeconds: 600

probes:
  startup:
    path: /actuator/health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 18
  liveness:
    path: /actuator/health
    port: 8080
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    path: /actuator/health
    port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

strategy:
  type: Recreate
