databaseChangeLog:
  # =====================================================
  # HEMIS DATABASE MIGRATIONS (v2.1 — Sequential Renumber, Gap-Free)
  # =====================================================
  # 19 schema + 17 seed + 9 migration changesets.
  #
  # Order principle: STRICT dependency order — every table is created AFTER
  # the tables it references. Every FK is declared INLINE; NO cross-file
  # `ALTER TABLE ADD CONSTRAINT`. Each migration is self-contained and final.
  #
  # IMPORTANT: Greenfield-safe EMAS!
  # employee/users use FKs to legacy hemishe_h_* and hemishe_e_university.
  # =====================================================

  - property:
      name: changelog.path
      value: db/changelog/db.changelog-master.yaml

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 1: SCHEMA — 15 files (strict dependency order)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # V001: role                                      (RBAC catalog leaf)
  # V002: permission                                (RBAC catalog leaf)
  # V003: position_type + position                  (HR classifiers — HR-foundation)
  # V004: employee + employee_job                   (HR core — references V003 position)
  # V005: organization + university_profile         (TIN registry + admin-managed contacts)
  # V006: users + password_history + password_reset_token + oauth_client + oauth_client_role
  #                                                 (employee_id → V004, organization_id → V005, role_id → V001)
  # V007: user_role + role_permission               (RBAC junctions — references V001/V002/V006)
  # V008: university_founder                        (references V004 employee, V005 organization)
  # V009: university_lifecycle                      (immutable log)
  # V010: buildings (5 tables)                      (depends on hemishe_e_university)
  # V011: system_message + system_message_translation (i18n catalog)
  # V012: language + configuration                  (i18n + system settings)
  # V013: menu + user_favorite                      (UI — references V006 users)
  # V014: outbox_event + employee/employee_job sync metadata (ADR-0010, ADR-0007)
  # V015: webhook_target + webhook_delivery_log     (ADR-0012)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

