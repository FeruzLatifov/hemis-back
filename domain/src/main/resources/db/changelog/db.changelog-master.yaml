databaseChangeLog:
  # =====================================================
  # HEMIS DATABASE MIGRATIONS
  # =====================================================
  # 13 schema + 8 seed + 5 migration = 26 changeset
  # =====================================================

  - property:
      name: changelog.path
      value: db/changelog/db.changelog-master.yaml

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 1: SCHEMA — 13 files, 20 tables
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # V001: users + password_history + password_reset_token (3)
  # V002: roles (1)
  # V003: permissions (1)
  # V004: user_roles (1)
  # V005: role_permissions (1)
  # V006: system_messages + system_message_translations (2)
  # V007: languages (1)
  # V008: menus + user_favorites (2)
  # V009: position_types + positions + employee + employee_jobs (4)
  # V010: university_legal (1), V011: university_founder (1), V012: university_lifecycle (1), V013: university_cadastre (1)
  # Total: 20 tables
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - changeSet:
      id: V001_create_users
      author: hemis-team
      logicalFilePath: ${changelog.path}
      comment: "Auth: users + password_history + password_reset_token"
      preConditions:
        - onFail: MARK_RAN
        - not: { tableExists: { tableName: users } }
      changes:
        - sqlFile: { path: changesets/schema/V001_create_users.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/schema/V001_create_users_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
