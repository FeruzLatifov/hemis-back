  - changeSet:
      id: M015_permission_action_restore
      author: hemis-team
      logicalFilePath: ${changelog.path}
      comment: "permission.action CHECK widened with 'restore' - the eleventh verb, and the first added since V002. It exists because restoring a soft-deleted row and deleting one are opposite risks (one returns a row, the other hides it), so `universities.restore` is its own permission rather than a second meaning for `universities.delete`; a role can then hold the repair without holding the damage. Registered DIRECTLY BEFORE S038, which INSERTs that permission row: with the old ten-verb constraint still in force the seed would abort with 23514 and take the deploy with it. The value is one of THREE coupled places - this constraint, enum PermissionAction.RESTORE, and Permission.isWritePermission() - and the one that bites is the enum: PermissionActionConverter.valueOf() throws while loading permissions, i.e. HTTP 500 at LOGIN for whoever was granted it, not an error at seed time. V002 is applied in production and is never edited, hence a new migration that swaps the constraint. Pure widening - verified on the live database: 118 permission rows, 0 with an action outside the V002 list - so every existing row already satisfies it and the ALTER validates without a rewrite. Idempotent (DROP IF EXISTS + ADD); SET LOCAL lock_timeout keeps the ACCESS EXCLUSIVE lock from queueing behind a reader and stalling every sign-in. Rollback re-narrows the list and stops loudly, naming the codes, if an action = 'restore' row is still present (S038's rollback removes the only one, and unwinds first)."
      changes:
        - sqlFile: { path: changesets/migration/M015_permission_action_restore.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/migration/M015_permission_action_restore_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: S038_seed_access_control
      author: hemis-team
      logicalFilePath: ${changelog.path}
      runOnChange: true
      comment: "One changeset for one decision - who can do what. Three human tiers instead of 'SUPER_ADMIN or nothing': SUPER_ADMIN (all), MINISTRY_ADMIN renamed to ADMIN and shown as 'Administrator' (everything except the 16 platform/security-critical codes whose misuse cannot be undone from inside the app - roles.*/permissions.manage, webhook.*/oauth-clients.manage, settings.edit/menus, pinfl.view, outbox.manage, students/teachers delete), and a NEW role TECH_STAFF 'Texnik xodim' (classifier operator: view/create/edit + attach to OTM; no approve, no delete, no restore). CLASSIFIER_MANAGER is a different job and is left untouched - technical staff get their own role rather than a re-labelled one. Adds permission classifiers.delete, split out of classifiers.edit so an operator can add and correct classifier rows without being able to remove one (ClassifierWebController DELETE now requires it). Maker/checker: the operator holds classifiers.speciality.create/edit but not .approve, and HSpecialityService refuses APPROVED without that authority, so only an administrator publishes a speciality to 230 OTMs. Also folds in the dashboard fix: menu.code='dashboard' was the ONLY row seeded with permission = NULL (S011) and MenuService.hasPermission(null, ...) returns TRUE for a NULL requirement, so 'Bosh sahifa' rendered for EVERY authenticated user while GET /api/v1/web/dashboard/stats stayed gated by hasAuthority('dashboard.view'); the row now names its permission and every human role holds the grant, and M014 (registered after this) makes the column NOT NULL. MINISTRY_ADMIN -> ADMIN is a code rename done here, merge-safe (users moved, legacy row soft-deleted if both exist): S001/S004/S016/S020/S023 and M004/M005 still create and grant MINISTRY_ADMIN and are never edited, but they all run before this seed. Supersedes the two seeds this work was first written as (S038 dashboard access, S039 role model), neither of which left a developer database. Two changes to that boundary. universities.delete LEAVES the SUPER_ADMIN-only list: deleting an OTM is a soft delete (delete_ts) and is now reversible from the recycle bin, so the list's own criterion - misuse that cannot be undone from inside the app - stops applying to it; students.delete and teachers.delete stay, because no OTM re-sends a row the center dropped. And a NEW permission universities.restore gates the bin itself (GET .../universities/deleted + POST .../{code}/restore), split from universities.delete rather than folded into it because the two carry opposite risk and a role may legitimately hold one without the other; both admin tiers get it (SUPER_ADMIN takes everything, ADMIN takes everything not on the reserved list), TECH_STAFF does not - that role is 'no approve, no delete, no restore'. Its action value 'restore' is new to permission.action, which is why M015 runs immediately before this seed. Idempotent and runOnChange: grants are ON CONFLICT DO NOTHING and the boundary is re-asserted by DELETEs on every run - but ONLY for the two security boundaries (SUPER_ADMIN-only codes off ADMIN, audit.view off everyone else). The TECH_STAFF verification now RAISEs a NOTICE instead of an EXCEPTION: its list is a starting point that an administrator is meant to widen or narrow in the role editor, and since this changeset is runOnChange, an EXCEPTION there turned the next unrelated edit into a failed deploy on any database where that screen had been used as designed. The two temp tables were also renamed s040_* -> s038_* - leftovers from when this work was numbered S039/S040, both of which now exist in this changelog as unrelated i18n seeds."
      changes:
        - sqlFile: { path: changesets/seed/S038_seed_access_control.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/seed/S038_seed_access_control_rollback.sql, relativeToChangelogFile: true, splitStatements: false }
  - changeSet:
      id: M014_menu_permission_not_null
      author: hemis-team
      logicalFilePath: ${changelog.path}
      comment: "menu.permission NOT NULL - deny by default for navigation. A NULL permission means 'visible to everyone' in MenuService.hasPermission, which silently contradicts the @PreAuthorize on the page behind it (the S011 'dashboard' row, repaired in S038). The constraint makes the convention an invariant: every menu row names the permission its page requires. Runs AFTER S038 (which clears the only NULL); fails loudly naming offending rows instead of leaving a permissionless entry."
      changes:
        - sqlFile: { path: changesets/migration/M014_menu_permission_not_null.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/migration/M014_menu_permission_not_null_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: S039_seed_history_dialog_i18n
      author: hemis-team
      logicalFilePath: ${changelog.path}
      runOnChange: true
      comment: "14 translation keys for the audit trail. Two are the record-history dialog's subtitles: 'Who did what, and when' and 'Attached, edited and detached specialities' - the owner-scoped list is not a field diff (an attach or a detach creates or removes a whole row), so reusing 'Changed fields' there was factually wrong. The other ten are the vocabulary the dialog was missing: it rendered the log RAW - UPDATE, reviewStatus, NEEDS_REVIEW, distributable true-to-false - which is right to STORE (a record of what happened must not depend on today's wording) and wrong to SHOW. The frontend now resolves every action, field name and enum value through one dictionary (components/audit/audit-labels.ts) shared by the history dialog, the ministry journal and its detail drawer: past-tense actions Updated/Deleted/Restored/Viewed/Exported/Imported (Created is S010), the two field names no dictionary covered ('Distributed to the OTMs' for the derived HSpeciality.isDistributable, 'Name (Uzbek Cyrillic)' for name_oz), and Expand/Collapse - used by SpecialityTree since it was written, never seeded, carried in the frontend's i18n-known-missing baseline until now. Plus two keys of the same drift found by running the sync itself - 'Client ID' and 'Last used' existed ONLY in the frontend JSONs, so the first sync after this changeset would have deleted the OAuth-clients table's column headers; they are seeded verbatim from those JSONs. NEW seed; S006/S010/S032..S037 are applied in prod and applied changesets are never edited. system_message is the single source of truth for the frontend JSONs (sync:translations rewrites them), so an unseeded key vanishes at the next sync."
      changes:
        - sqlFile: { path: changesets/seed/S039_seed_history_dialog_i18n.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/seed/S039_seed_history_dialog_i18n_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: S040_seed_university_recycle_bin_i18n
      author: hemis-team
      logicalFilePath: ${changelog.path}
      runOnChange: true
      comment: "4 translation keys for the university recycle bin. /institutions/universities gets what /classifiers/speciality has had since S036: a 'Deleted' button opening the list of soft-deleted rows and a Restore action bringing one back - the University entity carries @SQLRestriction('delete_ts IS NULL'), so a deleted OTM is invisible to every ordinary query and without a bin there is no way back from the UI. The keys are the dialog title ('Deleted universities'), the line that says what a soft delete actually does ('The university is hidden everywhere and can be restored later' - the university-shaped twin of the speciality sentence S036 seeded, used as both the bin's subtitle and the delete dialog's explanation), the success toast ('University restored'), and the new confirm text. That confirm replaces S009's '...This action cannot be undone.', which is now simply FALSE: the delete is reversible from the bin, and a dialog that overstates the damage teaches people to distrust confirm dialogs. The S009 row is left in place - an applied changeset owns its rows - but nothing renders it any more. No key for the button: 'Deleted' already exists (S039, the audit-log action chip) and both pages now share that one short label, which is also why the speciality button shrank from 'Deleted specialities' to 'Deleted' - it sat directly above a dialog with that same title, so the long form was redundant on the button and would have been doubly so with a second page repeating it. The twelve other strings the two dialogs need (Total, Loading..., Failed to load data, Nothing deleted yet, Code, Name, Deleted at, Deleted by, Actions, Restore, Close, INN) are already seeded by S006/S009/S010/S036 and are reused verbatim. NEW seed; S006/S009/S010/S032..S039 are applied in prod and applied changesets are never edited. system_message is the single source of truth for the frontend JSONs (sync:translations rewrites them from it), so an unseeded key vanishes at the next sync."
      changes:
        - sqlFile: { path: changesets/seed/S040_seed_university_recycle_bin_i18n.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/seed/S040_seed_university_recycle_bin_i18n_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: M016_university_child_fk_restrict
      author: hemis-team
      logicalFilePath: ${changelog.path}
      comment: "The two child tables that still hang off hemishe_e_university with ON DELETE CASCADE - university_profile (V005, 1:1) and university_founder (V008) - are switched to ON DELETE RESTRICT, joining the six that already restrict (employee_job, oauth_client, university_building, university_speciality_attachment, university_lifecycle, diploma_blank_distribution) for eight in total; the two SET NULLs that point at hemishe_e_university - users.university_id and university_lifecycle.successor_code - are deliberate and stay, as is employee.department_code, which points elsewhere. A university is NEVER hard-deleted: the registry does a soft delete (delete_ts) and the recycle bin brings it back, so CASCADE protects nothing that happens in normal operation - it only sits there as a loaded gun for the one path that must never be taken silently. If a DELETE ever does reach the table - a hand-written repair on a production console, a rollback script, a future ON DELETE that nobody re-read - CASCADE takes the OTM's profile and its founders with it, and neither is reconstructable from the row that was deleted: they carry contact details, the MinIO file keys of the uploaded documents, and the founders' identities. RESTRICT turns that into an error that names the offending child, which is a five-minute conversation instead of a data-loss incident. It also removes the mismatch where a single table's delete behaviour depended on which FK you looked at. Idempotent: the constraints are dropped by name and re-added with the same name and columns; no data is touched and no row can violate the new definition, since RESTRICT only changes what happens on a future DELETE. Rollback restores CASCADE on both."
      changes:
        - sqlFile: { path: changesets/migration/M016_university_child_fk_restrict.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/migration/M016_university_child_fk_restrict_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: S041_seed_university_restore_i18n
      author: hemis-team
      logicalFilePath: ${changelog.path}
      runOnChange: true
      comment: "Three translation keys the running code already asks i18next for and no seed ever created. 'Deleted items' is the recycle-bin BUTTON on /institutions/universities and /classifiers/speciality: both currently render S039's 'Deleted', which is the audit-log ACTION chip, and in Russian that value is 'Удалено' - a short neuter passive participle ('it was deleted'), exactly right stamped on a log row and wrong on a button meaning 'show me the deleted ones'. uz/oz carry both jobs in one word, so the collision is Russian-only, but a button and a log chip are two different jobs and get two keys; 'Deleted' stays with S039 and the two call sites move. 'Restores a deleted record' is the 'what it grants' microcopy for the `restore` action chip in the role -> permissions editor: S032 seeded that line for each of the ten existing actions, and universities.restore (S038) introduces the eleventh - the chip LABEL reuses S036's 'Restore', one word, one key. 'Grants permission' is UNKNOWN_ACTION_META.grantKey, the fallback the editor renders when the backend adds an action the frontend metadata does not know yet: it was in no JSON and no seed, so i18next returned the key itself and the chip tooltip, the aria-label and the detailed view all read English in uz, oz and ru - and check:i18n cannot catch it, because it is a value inside a metadata object rather than a t('literal') call site. NEW seed; S006/S009/S010/S032..S040 are applied in prod and applied changesets are never edited. system_message is the single source of truth for the frontend JSONs (sync:translations rewrites all four from it), so a key that is not seeded here vanishes at the next sync - run that sync after applying. Runs after S006 (_seed_msg helper)."
      changes:
        - sqlFile: { path: changesets/seed/S041_seed_university_restore_i18n.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/seed/S041_seed_university_restore_i18n_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: M017_h_speciality_allow_ordinatura
      author: hemis-team
      logicalFilePath: ${changelog.path}
      comment: "V018 shipped h_speciality as a two-tab bachelor+master screen and froze that into chk_h_speciality_edu_type CHECK (education_type IN ('11','12')). V022 already anticipated this step in its own header - it seeded all five types into h_education_type and wrote down what admitting a third would take (CHECK relax + data + FE tab) - so '13' Ordinatura is a live FK target today and only the CHECK stands between it and the classifier. This widens it to ('11','12','13') and nothing more: '14'/'15' (Doktorantura PhD/DSc) stay out because no doctoral speciality data has been handed over, and a CHECK that admits values nobody can supply is decoration rather than a guard. MUST stay ordered immediately BEFORE S042, which inserts the 69 ordinatura rows - under the old CHECK every one of those INSERTs fails 23514. Safety: DROP + ADD of a CHECK on a ~5.6k-row table; the ADD re-validates every row, which is a millisecond scan that cannot fail on data (every existing row is '11' or '12' and still satisfies the wider predicate), but it does need an ACCESS EXCLUSIVE lock, so lock_timeout is set to 3s - on a busy database this fails fast and is retried rather than queueing behind a long read and blocking every writer behind it in turn. Idempotent: dropped IF EXISTS, re-added under the same name. The rollback refuses to narrow the CHECK while education_type = '13' rows survive and names them, rather than letting Postgres report an opaque 23514."
      changes:
        - sqlFile: { path: changesets/migration/M017_h_speciality_allow_ordinatura.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/migration/M017_h_speciality_allow_ordinatura_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: S042_seed_h_speciality_ordinatura
      author: hemis-team
      logicalFilePath: ${changelog.path}
      comment: "The 69 Ordinatura (residency) specialities, from the ministry's export of the frozen CUBA table hemishe_h_speciality_ordinatura. Generated by domain/etl/speciality/generate_s042_ordinatura.py - do not hand-edit, re-run the ETL. 69 and not the 70 the live legacy table holds: the 70th (7b2f1cec, code 17.00.09 'Raqs sanati') is a stray whose _parent points outside the ordinatura table and whose code uses the scientific-degree NN.NN.NN shape rather than the 8-digit classifier shape; the ministry's xlsx omits it and the ETL fails loudly if a future export puts it back. 71 rows, not 69: the two ancestor categories are cloned for education_type '13' - 900000 SOGLIQNI SAQLASH VA IJTIMOIY TAMINOT (L1) then 910000 Sogliqni saqlash (L2), with the 69 imported specialities at L3 beneath them. Every education type in this table already keeps its OWN complete copy of the tree: Bakalavr and Magistr each have 18 L1 + 59 L2 rows carrying identical codes and different ids (900000 = a3796ec1 for '11' and ae3b0823 for '12'; 910000 = 960be177 and 1f1187c0), and the two sets differ in exactly one row, by one hyphen. This is the third copy of the single branch ordinatura needs, with names, review status and audit flags taken verbatim from those twins and ids from the same uuid5 recipe S017 uses. The obvious alternative - reusing 960be177, the Bakalavr 910000 that 18 of the source rows already name as their _parent - is the only value the LEGACY schema accepts (hemishe_h_speciality_ordinatura._parent has an FK onto hemishe_h_speciality_bachelor(id) and CUBA types the field as HSpecialityBachelor; someone hung an ordinatura row off the MASTER 910000 once, on 2022-11-02, and soft-deleted it the same day). But the unified classifier filters getTree() by education type and surfaces a node whose parent is outside the filtered set AS A ROOT, so a '11' parent rendered the Ordinatura view as 69 flat rows with no hierarchy at all. Cloning also restores the invariant that held across all 5603 pre-existing rows: a child's education_type always equals its parent's. Anything that ever syncs ordinatura back into the legacy table must translate the cloned L2 id to 960be177; LegacySpecialitySyncService covers '11'/'12' only and does not touch these. Every row gets edition year 2023, ancestors included - the legacy _year column is empty, this classifier requires years, and all 36 L1 and 118 L2 rows already in the table carry at least one - and review_status APPROVED, like S014/S017 - a seed INSERT does not push, only HSpecialityService.update() emits an outbox event. Row ids are the legacy UUIDs verbatim, because LegacySpecialitySyncService bridges h_speciality back into the frozen hemishe_h_speciality_* tables BY UUID and a fresh uuid would fork each row in two. version = -1 on all 71 (ministry instruction), which is this table's own baseline rather than an oddity: 5512 of the 5603 pre-existing rows carry -1, including all four ancestor twins, and the higher values are the handful edited through the UI since (60 at 1, 41 at 2, 11 at 3) because @Version increments from wherever a row starts. Inserting at 1 would have made every imported row look as if it had already been curated once. is_checked keeps the source value (35 of 69 true). Names have their apostrophes folded to the project-standard letters (o-turned-comma U+02BB, U+02BC) as in S014/S017 - cosmetic for identity, since h_speciality_fold() maps every variant to a space. name_oz is NULL throughout (the source carries a Russian column and no Uzbek-Cyrillic one). One documented correction: row 19d8acc7 (80910725 Parodontologiya) carried the English word 'Periodontology' in name_ru with name_en empty, so it is moved to name_en and name_ru left NULL - English text in the Russian column renders as English to a Russian reader, and nothing is lost because that value was never Russian. Duplicated codes 80910714 and 80910715 each name two different specialities in the source and both members of each pair are kept: uq_h_speciality_identity is (education_type, code, name_search), so they are distinct rows. Idempotent via ON CONFLICT DO NOTHING on both tables. Additive - hemishe_h_speciality_ordinatura and the 175/175 legacy contract are untouched. Requires M017 (the widened CHECK) immediately above."
      changes:
        - sqlFile: { path: changesets/seed/S042_seed_h_speciality_ordinatura.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/seed/S042_seed_h_speciality_ordinatura_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: S043_seed_ordinatura_i18n
      author: hemis-team
      logicalFilePath: ${changelog.path}
      runOnChange: true
      comment: "Two translation keys for the education type M017/S042 add to the speciality classifier. First, 'Residency' (uz Ordinatura, oz/ru Ординатура) - its name. Until now the classifier admitted exactly two types and every screen that had to name one wrote it as a two-way ternary (code === '11' ? t('Bachelor') : t('Master')) on the page header, the create dialog, the edit dialog and both detail views; with Ordinatura in the table those would have labelled all 69 residency specialities 'Magistr'. They now go through one helper, educationTypeLabelKey in speciality.api.ts, which resolves '13' to this key. On the frontend the label is only a fallback - each of those screens prefers the name h_education_type returns for the code, and reaches for t() only while those options are still loading - but the backend's .xlsx export asks for it directly (SpecialityClassifierController.buildLabels calls i18nService.getMessage('Residency', lang) to title the third worksheet), so an unseeded key would print the literal English word into a Russian export. The values match V022's h_education_type row exactly, so the fallback and the classifier cannot disagree about what to call the same thing. Second, 'Unified speciality classifier' - the page subtitle. /classifiers/speciality announced itself as the 'Unified bachelor and master speciality classifier', a sentence that stopped being true the moment Ordinatura landed and that would go stale again at the next type; the new wording names no education type at all, so it survives them. S010's key is not deleted - an applied changeset keeps its rows - the page simply stops rendering it. NEW seed; S006/S009/S010/S032..S041 are applied in prod and applied changesets are never edited. system_message is the single source of truth for the frontend JSONs (sync:translations rewrites all four from it), so a key that is not seeded here vanishes at the next sync - run that sync after applying. Runs after S006 (_seed_msg helper)."
      changes:
        - sqlFile: { path: changesets/seed/S043_seed_ordinatura_i18n.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/seed/S043_seed_ordinatura_i18n_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: S044_fix_speciality_310000_typo
      author: hemis-team
      logicalFilePath: ${changelog.path}
      comment: "One spelling fix, one row, one column, under an explicit ministry scope rule: the L1/L2 rows of this classifier are CATEGORY LABELS - the same 18 + 59 of them are duplicated under every education type - and a spelling error in one of those labels may be corrected, while the L3/L4 rows are the official speciality names themselves and are NEVER touched, staying byte-for-byte as the source xlsx delivered them. Comparing the Bakalavr and Magistr L1/L2 sets row by row they agree on 76 of 77 and disagree on exactly one character: code 310000 is 'Ijtimoiy va xulq-atvorga mansub fanlar' under '11' (hyphen, 0x2d) and 'Ijtimoiy va xulq atvorga mansub fanlar' under '12' (space, 0x20). Xulq-atvor is one hyphenated word in Uzbek, so the Bakalavr spelling is right and the Magistr row carries the typo - not one this project introduced, since S014 imported it verbatim from the ministry's 3_Magistr.xlsx, which is what a faithful import should do, but the consequence is that the same category reads differently depending on which tab you open, and differently again in the .xlsx export and in whatever the 224 OTMs are shown. A full scan of all 154 L1/L2 rows found no other defect: no straight or curly apostrophe where the project standard is U+02BB / U+02BC, no doubled or edge whitespace, no other Bakalavr-Magistr divergence. The 34 children of ed932734 are untouched, as are its code, id, parent, years and the Bakalavr twin. version is bumped on purpose: the row sits at the table's -1 baseline with 5511 others and the bump moves it to 0 and with it the SUM(version) snapshot Univer polls to decide whether the classifier changed, so leaving it alone would ship a silent edit. Three guards run before the write - the row must still carry the typo (a re-run does nothing and a hand-rename is never overwritten), the target row must be hierarchy_level 2 or the changeset raises rather than risk editing a speciality name, and the corrected identity must be free because uq_h_speciality_identity_live is UNIQUE on (education_type, code, name_search) among live rows and name_search is GENERATED from name_uz, so this UPDATE moves the row onto a NEW identity key. The rollback puts the space back under mirrored guards. NOTE: the source 3_Magistr.xlsx still contains the typo and etl_speciality.py has no override map, so re-running that ETL regenerates S014 with the old spelling - re-apply this changeset afterwards, same convention as the MANUAL CORRECTIONS blocks in the S015/S017 headers."
      changes:
        - sqlFile: { path: changesets/seed/S044_fix_speciality_310000_typo.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/seed/S044_fix_speciality_310000_typo_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: M018_sync_h_education_form_from_legacy
      author: hemis-team
      logicalFilePath: ${changelog.path}
      comment: "One-off catch-up: re-sync h_education_form from the frozen hemishe_h_education_form. V021 seeded our table 1:1 from that classifier and declared the ownership split that still holds - the ministry owns code, the uz name and active; we own name_ru/name_en (the CUBA source has no translations) and sort_order - but that seed ran ONCE, so anything the ministry has added since is invisible to us. That is not merely cosmetic: university_speciality_attachment.education_form FKs into our table with ON DELETE RESTRICT, so a form we never imported cannot be picked at all. This changeset carries no hard-coded row list on purpose - the snapshot it was written against is already in sync (13 of 13, codes 11-23), so a literal list would encode a diff that is only true there and would do nothing on the database where it matters; instead it diffs against whatever the legacy table holds wherever it runs. Three steps: INSERT every live numeric legacy code we lack, leaving name_ru/name_en NULL because those are ours to write and a guessed translation is worse than a visibly missing one (a NOTICE names them so they can be filled in); UPDATE the uz name and active flag of existing rows where the legacy value differs, touching neither RU/EN nor sort_order; and REPORT rows we hold that the legacy table no longer lists live WITHOUT deleting or deactivating them, since the FK restricts and an OTM attachment may already point at one - withdrawing a form is a decision with consequences and belongs to a human. Scope filters are byte-identical to V021's (numeric code, delete_ts IS NULL) so the two can never disagree about what the legacy set means. Inserted rows carry created_by = 'legacy-sync-M018', which is what makes the rollback precise. Idempotent - a second run reports zeroes. ONE-OFF: it catches up whatever has accumulated but does not keep the tables in step going forward; if that becomes a recurring need the durable fix is a scheduled re-sync or a button on the classifier screen, not a migration per addition. The same drift is possible in h_education_type (V022) and h_education_year (V018), which use this exact pattern and are in sync on the snapshot checked, so they are deliberately left alone. Caches classifierEducationForm and legacyClassifierMaps hold this data with a TTL, so a new form appears after eviction or expiry rather than instantly."
      changes:
        - sqlFile: { path: changesets/migration/M018_sync_h_education_form_from_legacy.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/migration/M018_sync_h_education_form_from_legacy_rollback.sql, relativeToChangelogFile: true, splitStatements: false }
