        - onFail: MARK_RAN
        - not: { tableExists: { tableName: users } }
      changes:
        - sqlFile: { path: changesets/schema/V001_create_users.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/schema/V001_create_users_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

