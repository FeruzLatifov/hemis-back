      comment: "h_speciality: SOFT DELETE (deleted_at/deleted_by) + uq_h_speciality_identity to'liq UNIQUE -> PARTIAL UNIQUE (WHERE deleted_at IS NULL; NULLS NOT DISTINCT SAQLANADI - ~15 kodsiz NEEDS_REVIEW qator uchun) + idx_h_speciality_deleted (IS NOT NULL, listDeleted uchun). Sabab: klassifikator qatori 224 OTM va eski talaba-saqlash jadvallariga UUID bilan bog'langan, jismoniy o'chirish qaytarib bo'lmaydigan zarar. Entity AuditableEntityNoSoftDelete -> AuditableEntity + @SQLRestriction. Partial unique bo'lmasa o'chirilgan qator identity slotini abadiy band qiladi va 'xato o'chirdim, qayta qo'shaman' 23505 -> 500 beradi (M012 da oauth_client.client_id bilan AYNI holat prodda kuzatilgan). Konstreynt V018'da ANIQ nomlangan, shuning uchun M012 dagi pg_constraint qidiruvi kerak emas. preCondition ATAYLAB YO'Q: SQL to'liq idempotent, columnExists+MARK_RAN esa konstreynt almashtirishni JIMGINA o'tkazib yuborib M012 hodisasini qaytarardi (M011/M012 ham preCondition'siz). DIQQAT: 3 ta 422 guard endi DB tayanchisiz - ON DELETE RESTRICT UPDATE'ga ishlamaydi; qoldiq poyga ataylab qabul qilindi (ADR-0014). Native SQL @SQLRestriction bilan filtrlanmaydi - LegacySpecialitySyncService'ning 4 statement'iga mudofaa sifatida 'AND s.deleted_at IS NULL' qo'shildi (INSERT allaqachon APPROVED-gated, ya'ni bu chuqurlashtirilgan himoya). CONCURRENTLY EMAS (~5.4k qator; DROP+CREATE bitta tranzaksiyada). Rollback soft-deleted qatorlarni TIRILTIRADI va identity qayta ishlatilgan bo'lsa ATAYLAB to'xtaydi."
