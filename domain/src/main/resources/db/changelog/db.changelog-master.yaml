  # ─────────────────────────────────────────────────────────────────
  # M002 split — CONCURRENTLY index build (zero-downtime, prod-ready)
  #
  # Pattern: every changeset uses runInTransaction: false + CREATE INDEX
  # CONCURRENTLY (PostgreSQL constraint — CONCURRENTLY cannot run in tx
  # block). splitStatements: true ⇒ each ";" is its own session.
  # preConditions guard FROZEN-schema tables and pre-existing duplicates
  # (DEFENSIVE — MARK_RAN on miss, no data writes).
  #
  # Canonical rule: see .claude/LIQUIBASE_GUIDE.md "CONCURRENTLY pattern".
  # ─────────────────────────────────────────────────────────────────

  - changeSet:
      id: M002a_pg_trgm_extension
      author: hemis-team
      logicalFilePath: ${changelog.path}
      comment: "Enable pg_trgm extension — prerequisite for GIN trigram indexes."
      changes:
        - sqlFile: { path: changesets/migration/M002a_pg_trgm_extension.sql, relativeToChangelogFile: true, splitStatements: false }
      rollback:
        - sqlFile: { path: changesets/migration/M002a_pg_trgm_extension_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

  - changeSet:
      id: M002b_student_indexes
      author: hemis-team
      logicalFilePath: ${changelog.path}
      runInTransaction: false
      comment: "hemishe_e_student 24 ta index — filter + B-tree + GIN trigram + prefix + composite + keyset + dup-analysis. CONCURRENTLY, online build."
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'hemishe_e_student'"
      changes:
        - sqlFile: { path: changesets/migration/M002b_student_indexes.sql, relativeToChangelogFile: true, splitStatements: true, endDelimiter: ";" }
      rollback:
        - sqlFile: { path: changesets/migration/M002b_student_indexes_rollback.sql, relativeToChangelogFile: true, splitStatements: true, endDelimiter: ";" }

  - changeSet:
      id: M002c_student_pinfl_master_unique
      author: hemis-team
      logicalFilePath: ${changelog.path}
      runInTransaction: false
      comment: "PINFL master uniqueness (partial UNIQUE) — concurrent-enrollment race fix. MARK_RAN if existing duplicates."
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'hemishe_e_student'"
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM (SELECT pinfl FROM hemishe_e_student WHERE is_duplicate = true AND delete_ts IS NULL GROUP BY pinfl HAVING COUNT(*) > 1) dups"
      changes:
        - sqlFile: { path: changesets/migration/M002c_student_pinfl_master_unique.sql, relativeToChangelogFile: true, splitStatements: true, endDelimiter: ";" }
      rollback:
        - sqlFile: { path: changesets/migration/M002c_student_pinfl_master_unique_rollback.sql, relativeToChangelogFile: true, splitStatements: false }

