# =====================================================
# HEMIS Test Configuration — H2 in-memory (default)
# =====================================================
# Bu config TEST-LEVEL DEFAULT — light unit/slice testlar uchun.
# H2 MODE=PostgreSQL bilan PostgreSQL dialect emulate qiladi.
#
# !!! DIQQAT — ikki test infra'si mavjud:
# 1. H2 (bu fayl): @WebMvcTest, @JsonTest, fast unit slice testlar uchun.
# 2. Testcontainers PG-16: app/src/test/java/uz/hemis/app/integration/
#    AbstractIntegrationTest extend qilgan testlar uchun (full @SpringBootTest
#    + real Liquibase migration apply). Docker mavjud bo'lganda yoqiladi
#    (@EnabledIf gate). Real production PG hech qachon test'da tegmaydi —
#    Testcontainers o'zining ephemeral PG container'i (Docker tug'ilganda
#    fresh, test oxirida o'chiriladi).
#
# Tafsilot: domain/CLAUDE.md "Testing Strategy" bo'limi.
# =====================================================

spring:
  # =====================================================
  # H2 In-Memory Database (Test Only)
  # =====================================================
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # =====================================================
  # JPA Configuration (Test)
  # =====================================================
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # Auto-create schema, drop after tests
    show-sql: false  # Set to true for debugging
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false

  # =====================================================
  # Flyway (Disabled for Tests)
  # =====================================================
  flyway:
    enabled: false  # Don't run migrations in tests

  # =====================================================
  # H2 Console (Debugging Only)
  # =====================================================
  h2:
    console:
      enabled: false  # Set to true for debugging

# =====================================================
# Logging (Test)
# =====================================================
logging:
  level:
    root: WARN
    uz.hemis: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# =====================================================
# JWT Configuration (Test)
# =====================================================
hemis:
  security:
    oauth:
      client-id: test-client
      client-secret: test-secret
    jwt:
      secret: test-secret-key-minimum-256-bits-required-for-hmac-sha256-algorithm
      expiration: 3600  # 1 hour
      refresh-expiration: 7200  # 2 hours
      issuer: hemis-test

# =====================================================
# IMPORTANT NOTES
# =====================================================
# 1. H2 in-memory database — light unit slice testlar uchun (fresh per test)
# 2. Integration testlar (Testcontainers PG-16) o'zining ephemeral
#    PostgreSQL container'ini ishlatadi (AbstractIntegrationTest gate)
# 3. Real PRODUCTION PostgreSQL hech qachon test'da tegmaydi
# 4. Flyway DISABLED, Liquibase off (H2 dialect — schema ddl-auto: create-drop)
# 5. DDL auto-create — har test fresh schema
# =====================================================
