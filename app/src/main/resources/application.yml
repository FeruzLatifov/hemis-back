# =====================================================
# HEMIS Application Configuration
# =====================================================
# Stack: Spring Boot 4.0.6 + Java 25 + PostgreSQL 18
# Mode: NO-RENAME • NO-DELETE • NO-BREAKING-CHANGES
# =====================================================

spring:
  application:
    name: hemis

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # include: redis  # Disabled - using JWT (stateless), not Redis sessions

  # =====================================================
  # Virtual Threads (Java 25 LTS, JEP 491 — synchronized pinning fixed)
  # =====================================================
  # Tomcat HTTP request threads + @Async (default executor) → virtual threads.
  # Bounded executors with explicit names (e.g. auditTaskExecutor) keep their
  # platform thread pool — backpressure semantics preserved.
  threads:
    virtual:
      enabled: true

  # =====================================================
  # Graceful Shutdown Phase Timeout
  # =====================================================
  # Spring SmartLifecycle phase'ida har bir bean uchun shutdown timeout.
  # Tugallanmagan request'lar tugashiga yetarli vaqt beradi.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # =====================================================
  # Lazy Initialization (fixes Sentry BeanPostProcessor warnings)
  # =====================================================
  main:
    lazy-initialization: false  # Global lazy disabled
    allow-bean-definition-overriding: true

  # =====================================================
  # DataSource Configuration (Master/Replica)
  # =====================================================
  # CRITICAL: Connects to existing ministry.sql database
  # NO schema generation - Liquibase migrations only
  # Master: Write operations (CREATE, UPDATE, DELETE)
  # Replica: Read operations (SELECT)
  # =====================================================

  datasource:
    # Master Database (Write Operations)
    master:
      jdbc-url: jdbc:postgresql://${DB_MASTER_HOST}:${DB_MASTER_PORT}/${DB_MASTER_NAME}
      username: ${DB_MASTER_USERNAME}
      password: ${DB_MASTER_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        # Connection leak detection — agar 60s'dan ortiq connection qaytarilmasa,
        # Hikari WARN log yozadi va stack trace beradi (debugging uchun).
        # Production'da connection leak tez-tez sodir bo'lib turadi (try-with-resources unutsa).
        leak-detection-threshold: 60000
        pool-name: HikariPool-Master
        auto-commit: false
        data-source-properties:
          ApplicationName: HEMIS-Master

    # Replica Database (Read Operations)
    replica:
      jdbc-url: jdbc:postgresql://${DB_REPLICA_HOST}:${DB_REPLICA_PORT}/${DB_REPLICA_NAME}
      username: ${DB_REPLICA_USERNAME}
      password: ${DB_REPLICA_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        pool-name: HikariPool-Replica
        read-only: true
        auto-commit: false
        data-source-properties:
          ApplicationName: HEMIS-Replica

  # =====================================================
  # Redis Configuration (OAuth2 Token Storage)
  # =====================================================
  # CRITICAL: OLD-HEMIS uses Redis for token storage
  # Same Redis structure for backward compatibility
  # =====================================================

  data:
    redis:
      client-type: jedis
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      jedis:
        pool:
          # Sized for virtual threads (1000+ concurrent vthreads possible).
          # Without sufficient pool size, Redis becomes a bottleneck.
          max-active: 100
          max-idle: 50
          min-idle: 10
          max-wait: 2000   # 2s — fail-fast instead of indefinite wait

  # =====================================================
  # Spring Cache Configuration
  # =====================================================
  # Managed by DashboardCacheConfig.java (@Primary CacheManager bean)
  # - Supports: menu, i18n, userPermissions, stats
  # - TTL: 60 minutes (default), 30 minutes (dashboard)
  # - Backend: Redis with JSON serialization
  # - Prefix: cache:
  # =====================================================

  # =====================================================
  # JPA/Hibernate Configuration
  # =====================================================
  # CRITICAL: ddl-auto=none - NO schema generation
  # Entities mapped via @Table/@Column to existing tables
  # =====================================================

  jpa:
    hibernate:
      ddl-auto: none  # NEVER generate schema

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        # Dialect auto-detected - do NOT set hibernate.dialect
        format_sql: true
        use_sql_comments: false
        default_schema: public

        # Query optimization
        query:
          plan_cache_max_size: 2048

        # Batch processing
        jdbc:
          batch_size: 20            # INSERT/UPDATE batch
        order_inserts: true
        order_updates: true

        # Lazy-load batch fetching — drops N+1 SELECT loops to ceil(N/20) IN-clause queries.
        # Match jdbc.batch_size; required for default Hibernate behavior on @ManyToOne(LAZY) graphs.
        default_batch_fetch_size: 20

  # =====================================================
  # Jackson Configuration
  # =====================================================

  jackson:
    use-jackson2-defaults: true
    default-property-inclusion: non_null
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Tashkent

  # =====================================================
  # Kafka Configuration (ADR-0007, ADR-0012)
  # =====================================================
  # Transactional Outbox + webhook fanout uchun.
  # Dev: docker-compose KRaft single broker (localhost:9092).
  # Prod: K8s + Strimzi 3-broker cluster (TLS + SASL).
  # =====================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${spring.application.name:hemis-back}

    producer:
      # Idempotent producer (exactly-once semantics)
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: snappy
        linger.ms: 5  # Batch window
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:hemis-back-default}
      auto-offset-reset: earliest
      enable-auto-commit: false  # Manual ack (idempotency tomonda boshqarish)
      properties:
        isolation.level: read_committed  # Faqat committed message'larni o'qish
        max.poll.records: 100
        session.timeout.ms: 30000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual_immediate
      concurrency: 3  # 3 ta concurrent consumer (default)
      missing-topics-fatal: false  # Topic hali yo'q bo'lsa app to'xtatmasin

# =====================================================
# SpringDoc OpenAPI (Swagger) Configuration
# =====================================================
# Multi-Group Configuration for Audience-Based Separation
# =====================================================

springdoc:
  # Global API Docs Settings
  # Production: application-prod.yml override qiladi (enabled: false)
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs

  # Swagger UI Settings
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    filter: false # Dropdown'ni o'chirish
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    try-it-out-enabled: true
    # Dark Theme CSS
    custom-css-path: /swagger-ui/swagger-ui-dark.css

    # Alohida URLs - har biri faqat o'z API'sini ko'radi
    # /docs/web → Web Frontend API
    # /docs/university → Universitet API

  # Show actuator endpoints in Swagger
  show-actuator: false

  # Disable default ResponseEntity wrapping
  override-with-generic-response: false

  # =====================================================
  # Multi-Group API Documentation
  # =====================================================
  # Note: Groups configured in OpenApiConfig.java
  # - 🌐 web: Web Frontend API v1 (/api/v1/web/**)
  # - 🎓 external: Universities & Organizations (/app/rest/v2/**)
  # - 📦 legacy: Old-HEMIS compatible (entities/services)
  # - 🎯 all: Complete documentation (internal)
  # =====================================================

# =====================================================
# Server Configuration
# =====================================================
# CRITICAL: Port 8080 for legacy API compatibility
# =====================================================

server:
  port: ${SERVER_PORT:8081}

  # =====================================================
  # Graceful Shutdown (K8s rolling update, zero-downtime)
  # =====================================================
  # SIGTERM qabul qilingach Tomcat yangi request'larni reject qiladi,
  # tugallanmagan request'larga timeout beradi. K8s terminationGracePeriodSeconds
  # qiymati timeout'dan kattaroq bo'lishi kerak (default 30s).
  shutdown: graceful

  servlet:
    context-path: /

  # =====================================================
  # Tomcat Configuration
  # =====================================================
  # maxHttpHeaderSize: JWT tokenlar katta bo'lganda kerak
  # Default: 8KB (8192) - ko'pincha yetarli emas
  # =====================================================
  tomcat:
    max-http-header-size: 48KB
    max-swallow-size: 2MB

  compression:
    enabled: true
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - application/javascript
      - application/json

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# =====================================================
# Actuator Configuration
# =====================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings,liquibase

  endpoint:
    health:
      show-details: when-authorized
      # K8s readiness/liveness probes:
      #   /actuator/health/liveness — Pod ishlamasa restart kerakmi?
      #   /actuator/health/readiness — Pod traffic qabul qilishga tayyormi?
      probes:
        enabled: true
      group:
        # Liveness — minimal check (faqat application running, DB/Redis emas).
        # DB down bo'lsa, K8s restart qilsa ham foyda yo'q.
        liveness:
          include: livenessState
        # Readiness — DB + Redis ulangan, traffic qabul qila oladi.
        readiness:
          include: readinessState,db,redis

  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    redis:
      enabled: true
    # LivenessState va ReadinessState health indicator'lari (probes uchun)
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# =====================================================
# Logging Configuration
# =====================================================

logging:
  level:
    root: INFO
    uz.hemis: INFO
    org.springframework: INFO
    org.hibernate: INFO
    # Suppress Hibernate dialect deprecation warning
    org.hibernate.orm.deprecation: ERROR
    # Suppress AuthenticationProvider warning (configuration is intentional)
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

  pattern:
    # MDC traceId/spanId — distributed tracing uchun (Micrometer Observation auto-fills)
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

# =====================================================
# Application-Specific Configuration
# =====================================================

hemis:
  # Swagger/OpenAPI configuration
  swagger:
    # Base URL for Swagger UI "Try it out". Empty (default) => relative "/", so requests follow the
    # SAME origin the docs page was opened from (localhost, LAN IP, or domain) — no host/CORS mismatch.
    # Pin an absolute URL only in prod behind a fixed domain, e.g. SWAGGER_SERVER_URL=https://hemis.uz
    server-url: ${SWAGGER_SERVER_URL:}

  # =====================================================
  # Outbox Pattern Configuration (ADR-0007, ADR-0010)
  # =====================================================
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poller:
      interval-ms: 1000   # Har sekund poll
      batch-size: 100     # Bir batch'da nechta event olish
    retention:
      days: 30            # Published event'larni 30 kun saqlash

  # =====================================================
  # Employee Sync Inbound Configuration (Univer → markaz)
  # =====================================================
  # 224 Univer → markaz xodim push. Controller HTTP qabul qiladi,
  # KafkaTemplate (key=PINFL) → topic. Consumer DB upsert.
  #
  # Partition by PINFL → bir xil PINFL har doim bir xil partition →
  # serial processing → optimistic-lock collision YO'Q.
  employee-sync:
    enabled: ${EMPLOYEE_SYNC_ENABLED:true}
    topics:
      inbound: hemis.employee.sync.inbound
      dlq: hemis.employee.sync.inbound.dlq
    producer:
      send-timeout-ms: 30000   # 202 oldidan acks=all kutish (batch yig'iladi)
    consumer:
      concurrency: 12          # = topic partitions (1 partition = 1 thread)
      retry:
        max-attempts: 3        # 3-marta retry → DLQ
        backoff-ms: 1000       # 1s fixed backoff (idempotent upsert — exponential kerak emas)

  # =====================================================
  # Webhook Outbound Configuration (ADR-0012)
  # =====================================================
  # Markaz → 224 Univer outbound callback infrastructure.
  webhook:
    enabled: ${WEBHOOK_ENABLED:true}
    # URL construction convention (2026-05-18):
    #   final = {protocol}://{hemishe_e_university.student_url}{suffix}
    # Misol: student_url="student.adu.uz" → "https://student.adu.uz/rest/v1/hemis-callback/event"
    # Sabab: 254 OTM uchun bir xil suffix saqlash dubl (DRY) — convention bir marta yoziladi.
    callback:
      protocol: ${WEBHOOK_CALLBACK_PROTOCOL:https}
      suffix: ${WEBHOOK_CALLBACK_SUFFIX:/rest/v1/hemis-callback/event}
    retry:
      max-attempts: 3              # ADR-0012 trim 2026-05-18 (5 → 3)
      initial-interval-ms: 1000    # 1 sekund (1-attempt)
      multiplier: 30                # 1s, 30s, 5min (exponential — total ~5 min)
      max-interval-ms: 300000       # 5 minut (cap)
    # Delivery log retention (lean strategiya — to'liq stack Sentry'da, sentry_event_id cross-link).
    # Status bo'yicha farqlangan: SUCCESS tez, FAILED uzoq, DLQ saqlanadi (manual review).
    retention:
      success-days: 30
      failed-days: 90
    # Secret shifrlash (K1) — plain HMAC secret AES-256-GCM bilan webhook_target.secret_enc'da saqlanadi.
    # Default YO'Q — JWT_SECRET/AUDIT_DB_PASSWORD kabi fail-fast: ENV o'rnatilmasa
    # WebhookSecretCipher bean qurilmaydi va app ko'tarilmaydi (zaif kalit prod'ga jimgina
    # sirib ketmasligi uchun). Dev default -> application-dev.yml, test qiymati -> application-test.yml.
    # Kalit yo'qolsa/o'zgarsa -> barcha 224 secret deshifrlanmaydi, rotation kerak. salt hex-encoded.
    secret-encryption:
      key: ${HEMIS_WEBHOOK_SECRET_ENCRYPTION_KEY}
      salt: ${HEMIS_WEBHOOK_SECRET_ENCRYPTION_SALT}
    dispatcher:
      connect-timeout-ms: 5000
      read-timeout-ms: 30000
      max-response-body-bytes: 4096  # Univer response truncation
    topics:
      events: hemis.webhook.events
      dlq: hemis.webhook.dlq

  # Audit Logging Configuration
  # SECURITY: AUDIT_DB_PASSWORD ENV majburiy AUDIT_ENABLED=true bo'lganda.
  # Hardcoded default ataylab olib tashlangan (production'da ENV unutilishi xavfli).
  audit:
    enabled: ${AUDIT_ENABLED:false}
    datasource:
      master:
        url: jdbc:postgresql://${AUDIT_DB_HOST:localhost}:${AUDIT_DB_PORT:5434}/${AUDIT_DB_NAME:hemis_audit}
        username: ${AUDIT_DB_USER:hemis_audit}
        password: ${AUDIT_DB_PASSWORD:}
      replica:
        url: jdbc:postgresql://${AUDIT_DB_REPLICA_HOST:${AUDIT_DB_HOST:localhost}}:${AUDIT_DB_REPLICA_PORT:${AUDIT_DB_PORT:5434}}/${AUDIT_DB_REPLICA_NAME:${AUDIT_DB_NAME:hemis_audit}}
        username: ${AUDIT_DB_REPLICA_USER:${AUDIT_DB_USER:hemis_audit}}
        password: ${AUDIT_DB_REPLICA_PASSWORD:${AUDIT_DB_PASSWORD:}}
    # Qaysi endpointlarni log qilmaslik
    exclude-patterns:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /favicon.ico
    # Request/response body max hajmi (bayt)
    max-body-size: 10240
    # Sensitive maydonlarni redact qilish (kalit-asosli; nomlar normalize qilinadi —
    # first_name/firstName/FirstName bir xil hisoblanadi). PINFL bundan tashqari
    # rekursiv value-scan orqali ham (14-raqamli qiymat) har joyda maskalanadi.
    redact-fields:
      - password
      - token
      - secret
      - clientSecret
      - client_secret
      - plainSecret
      - plain_secret
      - authorization
      - pinfl
      - firstName
      - lastName
      - middleName
      - fatherName
      - fullName
      - phone
      - parentPhone
      - email
      - birthday
      - serialNumber
      - passport
      - address
      - tin

  # API Configuration
  api:
    # Legacy CUBA REST API base path
    base-path: /app/rest/v2

  # GUVD Integration (Government Unified Virtual Database)
  integration:
    guvd:
      oauth2:
        url: ${GUVD_OAUTH2_URL:}
        client-id: ${GUVD_CLIENT_ID:}
        client-secret: ${GUVD_CLIENT_SECRET:}
        username: ${GUVD_USERNAME:}
        password: ${GUVD_PASSWORD:}
      passport-api-url: ${GUVD_PASSPORT_API_URL:}
      address-api-url: ${GUVD_ADDRESS_API_URL:}

    # API-MSPD Gateway (172.18.9.171) — markazlashgan integratsiya gateway
    api-mspd:
      base-url: ${API_MSPD_BASE_URL:http://172.18.9.171}
      username: ${API_MSPD_USERNAME:}
      password: ${API_MSPD_PASSWORD:}

    # BIMM Integration (api-mspd gateway orqali)
    bimm:
      oauth2:
        url: ${BIMM_OAUTH2_URL:}
        username: ${BIMM_OAUTH2_USERNAME:}
        password: ${BIMM_OAUTH2_PASSWORD:}
      api:
        base-url: ${BIMM_API_URL:}

  # External API Configuration (Government Services)
  external:
    # Personal Data Service (MVD Integration)
    personal-data:
      url: ${PERSONAL_DATA_URL:https://talaba.edu.uz/api/my_edu_uz/student_mvd_hemis.php}
      token: ${PERSONAL_DATA_TOKEN:}

    # Passport Data Service (Government Passport API)
    passport-data:
      url: ${PASSPORT_DATA_URL:https://api.gov.uz/passport}
      token: ${PASSPORT_DATA_TOKEN:}

    # BIMM Service (Beneficiary Information Management System)
    bimm:
      url: ${BIMM_URL:https://api.gov.uz/bimm}
      token: ${BIMM_TOKEN:}

    # Social Service (Social Registries and Support Programs)
    social:
      url: ${SOCIAL_URL:https://api.gov.uz/social}
      token: ${SOCIAL_TOKEN:}

  # CORS Configuration (for frontend)
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
      - X-Total-Count
    allow-credentials: true
    max-age: 3600

  # Security Configuration
  security:
    jwt:
      # JWT Secret Key (for HMAC-SHA256 signing)
      secret: ${JWT_SECRET}
      # Key ID — JWS header `kid` (must match JWK in SecurityConfig.jwtEncoder)
      key-id: ${JWT_KEY_ID:hemis-jwt-key}
      # Token expiration (seconds) - default: 1 hour (ADR-0009, 2026-05-18)
      expiration: ${JWT_EXPIRATION:3600}
      # Refresh token expiration (seconds) - default: 7 days
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
      # Issuer
      issuer: ${JWT_ISSUER:hemis-backend}
      # Public key or JWK Set URI for JWT validation (optional)
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      issuer-uri: ${JWT_ISSUER_URI:}
    oauth:
      # OTM (client_credentials) machine token TTL, seconds — default 24h. OTM backends are
      # system-to-system callers that reuse the token for its whole lifetime, so a short TTL only
      # forced needless re-requests. Env-tunable (OAUTH_CLIENT_TOKEN_EXPIRATION). SEPARATE from the
      # human/web JWT TTL (hemis.security.jwt.expiration, 1h ADR-0009) — never lengthens user sessions.
      client-token-expiration: ${OAUTH_CLIENT_TOKEN_EXPIRATION:86400}
      # Legacy client credentials (Basic auth)
      # CRITICAL: No defaults — must be configured per profile
      client-id: ${OAUTH_CLIENT_ID:}
      client-secret: ${OAUTH_CLIENT_SECRET:}
      # Scope returned in token responses
      scope: ${OAUTH_SCOPE:rest-api}

# =====================================================
# Spring Security OAuth2 Resource Server
# =====================================================
# JWT validation configuration
# Set one of the following:
#   - jwk-set-uri: URL to JWK Set (e.g., https://auth-server/.well-known/jwks.json)
#   - issuer-uri: Issuer URL (auto-discovers JWK Set URI)
# =====================================================

spring.security.oauth2.resourceserver:
  jwt:
    # JWK Set URI for token validation
    jwk-set-uri: ${JWT_JWK_SET_URI:}

    # OR Issuer URI (auto-discovers JWK Set URI)
    issuer-uri: ${JWT_ISSUER_URI:}

# =====================================================
# Legacy Fallback (old-HEMIS)
# =====================================================
legacy:
  old-hemis:
    base-url: ${OLD_HEMIS_BASE_URL:http://localhost:8081}

    # JWT validation settings
    # audiences: ${JWT_AUDIENCES:hemis-api}
    # principle-claim-name: sub

  # Database Configuration
  database:
    # Read-only mode enforcement (NO DELETE/TRUNCATE)
    read-only: false  # Set to true for read-only replicas
    enforce-no-delete: true  # Block DELETE operations at app level

# =====================================================
# ⭐ Sentry Error Tracking & Performance Monitoring
# =====================================================
# Spring Boot auto-configuration (v8.16.0+)
# Configure via environment variables or application.yml
# =====================================================
sentry:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${spring.profiles.active}}
  release: ${SENTRY_RELEASE:hemis-back@1.0.0}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

  # PII xavfsizligi (Rule #7): shaxsiy ma'lumotlar Sentry'ga yuborilmasligi.
  # Stack trace'dagi username/email avtomatik redact qilinadi.
  send-default-pii: ${SENTRY_SEND_DEFAULT_PII:false}

  # Stack trace'da qaysi paket "in-app" deb belgilanadi (Sentry UI da rangli)
  in-app-includes:
    - uz.hemis

  # Ignore noisy exceptions (expected runtime errors — 4xx client mistakes,
  # not server bugs). Sentry should focus on real 5xx server-side issues.
  ignored-exceptions-for-type:
    - uz.hemis.common.exception.ResourceNotFoundException     # 404 — not found
    - uz.hemis.common.exception.BadRequestException           # 400 — client input
    - uz.hemis.common.exception.ValidationException           # 400 — Bean Validation
#    - uz.hemis.common.exception.ConflictException             # 409 — duplicate (TODO: class yaratilmagan)
#    - uz.hemis.common.exception.ForbiddenException            # 403 — permission (TODO: class yaratilmagan)
    - org.springframework.security.access.AccessDeniedException
    - org.springframework.security.authentication.BadCredentialsException
    - org.springframework.web.bind.MethodArgumentNotValidException
    - jakarta.validation.ConstraintViolationException
    - org.springframework.http.converter.HttpMessageNotReadableException


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CACHE WARMUP CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Industry Best Practice: Pre-cache critical data at startup for instant responses
# Performance: First login 1ms (L1 hit) vs 50-100ms (cache miss + DB query)
# Strategy: ROLE-BASED + HYBRID (Google, Microsoft, Facebook best practice)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
cache:
  warmup:
    # Menu Cache Warmup - ROLE-BASED + HYBRID Strategy
    menu:
      enabled: true  # Set to false to disable menu warmup

      # Warmup mode: role-based (dynamic) or static (fallback)
      mode: role-based

      # Critical roles for synchronous warmup (VIP users)
      critical-roles:
        - SUPER_ADMIN
        - MINISTRY_ADMIN
        - UNIVERSITY_ADMIN

      # Maximum users per role to warmup (minimize startup time)
      max-users-per-role: 1

      # Fallback usernames for STATIC mode only (not used in role-based mode)
      sample-usernames: []
