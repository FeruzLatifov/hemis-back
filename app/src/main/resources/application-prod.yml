# =====================================================
# HEMIS Production Profile
# =====================================================
# CRITICAL: All secrets MUST come from environment variables
# =====================================================

spring:
  # =====================================================
  # Production DataSource (Master/Replica)
  # =====================================================
  # Master: Write operations (CREATE, UPDATE, DELETE)
  # Replica: Read operations (SELECT)
  # =====================================================

  datasource:
    # Master Database (Write Operations)
    master:
      jdbc-url: jdbc:postgresql://${DB_MASTER_HOST}:${DB_MASTER_PORT:5432}/${DB_MASTER_NAME}
      username: ${DB_MASTER_USERNAME}
      password: ${DB_MASTER_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-test-query: SELECT 1
        pool-name: HikariPool-Master-Prod
        data-source-properties:
          ApplicationName: HEMIS-Master-Prod
          tcpKeepAlive: true
          socketTimeout: 30

    # Replica Database (Read Operations)
    replica:
      jdbc-url: jdbc:postgresql://${DB_REPLICA_HOST}:${DB_REPLICA_PORT:5432}/${DB_REPLICA_NAME}
      username: ${DB_REPLICA_USERNAME}
      password: ${DB_REPLICA_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-test-query: SELECT 1
        read-only: true
        pool-name: HikariPool-Replica-Prod
        data-source-properties:
          ApplicationName: HEMIS-Replica-Prod
          tcpKeepAlive: true
          socketTimeout: 30

  # =====================================================
  # Production JPA Configuration
  # =====================================================

  jpa:
    show-sql: false  # Never log SQL in production

    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: false

        jdbc:
          batch_size: 50  # Higher for production

  # =====================================================
  # Production Liquibase Configuration
  # =====================================================
  # Safeguards:
  # 1. Database lock (DATABASECHANGELOGLOCK) - only 1 instance migrates
  # 2. Context filtering (contexts: production)
  # 3. Tag-based rollback support
  # 4. Validation before deployment (CI/CD)
  #
  # Best Practice: Run migrations before scaling to multiple instances
  # =====================================================

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: public
    contexts: production
    lock-timeout: 30
    liquibase-tablespace: null
    drop-first: false

  # =====================================================
  # Production Jackson override
  # =====================================================
  # Base config has indent-output: true (dev-friendly)
  # Production: compact JSON for performance
  # =====================================================

  jackson:
    serialization:
      indent-output: false

  # =====================================================
  # File upload limits
  # =====================================================

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# =====================================================
# Server Configuration (Production)
# =====================================================

server:
  port: ${SERVER_PORT:8080}

  # Reverse proxy support (nginx -> spring boot)
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      protocol-header: x-forwarded-proto
      remote-ip-header: x-forwarded-for

  error:
    include-stacktrace: never  # Never expose stack traces
    include-exception: false

  compression:
    enabled: true

  http2:
    enabled: true

  # SSL (enable when terminating TLS at app level, not at nginx)
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore.p12
  #   key-store-password: ${SSL_KEYSTORE_PASSWORD}
  #   key-store-type: PKCS12
  #   key-alias: hemis

# =====================================================
# Legacy OAuth Client Credentials (REQUIRED)
# =====================================================
# CRITICAL: Must be set via environment variables
# OAUTH_CLIENT_ID and OAUTH_CLIENT_SECRET
# Application will fail to start if blank
# =====================================================

hemis:
  security:
    oauth:
      client-id: ${OAUTH_CLIENT_ID}
      client-secret: ${OAUTH_CLIENT_SECRET}

# =====================================================
# Security Configuration (SecurityProperties.java)
# =====================================================
# Consumed by: uz.hemis.app.config.SecurityProperties
# =====================================================

security:
  oauth2:
    issuer-uri: ${OAUTH2_ISSUER_URI:https://auth.hemis.uz/realms/hemis}
    jwk-set-uri: ${OAUTH2_JWK_SET_URI:https://auth.hemis.uz/realms/hemis/protocol/openid-connect/certs}
    token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 86400

  cors:
    enabled: true
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hemis.uz}
    max-age: 3600

  rate-limit:
    enabled: true
    requests-per-minute: 100
    burst-capacity: 200
    global-requests-per-minute: 1000

  api:
    require-https: true
    log-requests: true
    log-responses: false
    max-request-size: 10485760

# =====================================================
# Cookie Configuration (WebAuthController.java)
# =====================================================
# Consumed by: uz.hemis.web.controller.WebAuthController
# =====================================================

app:
  security:
    cookie:
      secure: true
      same-site: Strict

# =====================================================
# External Government API (GovernmentMinorApiService.java)
# =====================================================
# Consumed by: uz.hemis.service.shared.GovernmentMinorApiService
# =====================================================

external:
  api:
    guvd:
      url: ${GUVD_API_URL:https://api.guvd.gov.uz}
      token: ${GUVD_API_TOKEN:}
    tax:
      url: ${TAX_API_URL:https://api.soliq.uz}
      token: ${TAX_API_TOKEN:}

# =====================================================
# Actuator Configuration (Production)
# =====================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when-authorized

  metrics:
    export:
      prometheus:
        enabled: true

# =====================================================
# Logging (Production)
# =====================================================

logging:
  level:
    root: WARN
    uz.hemis: INFO
    org.springframework: WARN
    org.hibernate: WARN
    liquibase: INFO

  file:
    name: ${LOG_FILE:/var/log/hemis/application.log}
    max-size: 100MB
    max-history: 30

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# =====================================================
# Required Environment Variables
# =====================================================
# Master Database:
#   DB_MASTER_HOST, DB_MASTER_PORT, DB_MASTER_NAME
#   DB_MASTER_USERNAME, DB_MASTER_PASSWORD
#
# Replica Database:
#   DB_REPLICA_HOST, DB_REPLICA_PORT, DB_REPLICA_NAME
#   DB_REPLICA_USERNAME, DB_REPLICA_PASSWORD
#
# Security:
#   OAUTH2_ISSUER_URI, OAUTH2_JWK_SET_URI
#   CORS_ALLOWED_ORIGINS
#   JWT_JWK_SET_URI, JWT_ISSUER_URI
#
# External APIs:
#   GUVD_API_TOKEN, TAX_API_TOKEN
#
# Logging:
#   LOG_FILE (default: /var/log/hemis/application.log)
#
# Optional:
#   SERVER_PORT (default: 8080)
#   SSL_KEYSTORE_PASSWORD (if SSL at app level)
# =====================================================
